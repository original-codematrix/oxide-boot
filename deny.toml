# cargo-deny policy for the oxide-boot workspace.
# Run: cargo deny check   (or `make audit`)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# Every entry here needs a `reason`. Remove entries as soon as a fix exists.
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "unmaintained only; pulled by opentelemetry_sdk 0.27, removed with the phase-4b otel upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",              # ryu
    "CDLA-Permissive-2.0",  # webpki-roots
]
confidence-threshold = 0.8
# Workspace crates with `publish = false` and no `license` field (examples).
private = { ignore = true }

[bans]
multiple-versions = "warn"
# Internal crates are path deps that also carry `version = "0.1.0"` in the root
# Cargo.toml. Those pins are what keeps `wildcards = "deny"` satisfied here: the
# `publish = false` exemption only engages together with `allow-wildcard-paths`,
# which is off by default. Dropping the pins therefore requires setting
# `allow-wildcard-paths = true` below in the same change -- one without the
# other fails `cargo deny check bans`. The pins are also what a future
# `publish = true` would need, so they stay.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
