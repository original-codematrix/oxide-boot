[workspace]
resolver = "3"
members = [
    "crates/oxide-core",
    "crates/oxide-macros",
    "crates/oxide-boot",
    "crates/oxide-web",
    "crates/oxide-web-macros",
    "crates/oxide-observability",
    "examples/hello-world",
    "examples/rest-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
oxide-core = { path = "crates/oxide-core" }
oxide-macros = { path = "crates/oxide-macros" }
oxide-boot = { path = "crates/oxide-boot" }
oxide-web = { path = "crates/oxide-web" }
oxide-web-macros = { path = "crates/oxide-web-macros" }
oxide-observability = { path = "crates/oxide-observability" }
axum = "0.8"
tower = "0.5"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
inventory = "0.3"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
tempfile = "3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
