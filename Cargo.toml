[workspace]
resolver = "3"
members = [
    "crates/oxide-core",
    "crates/oxide-macros",
    "crates/oxide-boot",
    "crates/oxide-web",
    "crates/oxide-web-macros",
    "crates/oxide-observability",
    "crates/oxide-kafka",
    "crates/oxide-kafka-macros",
    "crates/oxide-mongo",
    "crates/oxide-mongo-macros",
    "crates/oxide-redis",
    "crates/oxide-client",
    "crates/oxide-client-macros",
    "crates/oxide-test",
    "crates/oxide-test-macros",
    "examples/hello-world",
    "examples/rest-api",
    "examples/http-client",
    "examples/kafka",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
# V1 does not publish to crates.io; every workspace library crate sets
# `publish.workspace = true` to pick this up.
publish = false

[workspace.dependencies]
oxide-core = { path = "crates/oxide-core", version = "0.1.0" }
oxide-macros = { path = "crates/oxide-macros", version = "0.1.0" }
oxide-boot = { path = "crates/oxide-boot", version = "0.1.0" }
oxide-web = { path = "crates/oxide-web", version = "0.1.0" }
oxide-web-macros = { path = "crates/oxide-web-macros", version = "0.1.0" }
oxide-observability = { path = "crates/oxide-observability", version = "0.1.0" }
oxide-kafka = { path = "crates/oxide-kafka", version = "0.1.0" }
oxide-kafka-macros = { path = "crates/oxide-kafka-macros", version = "0.1.0" }
oxide-mongo = { path = "crates/oxide-mongo", version = "0.1.0" }
oxide-mongo-macros = { path = "crates/oxide-mongo-macros", version = "0.1.0" }
oxide-redis = { path = "crates/oxide-redis", version = "0.1.0" }
oxide-client = { path = "crates/oxide-client", version = "0.1.0" }
oxide-client-macros = { path = "crates/oxide-client-macros", version = "0.1.0" }
oxide-test = { path = "crates/oxide-test", version = "0.1.0" }
oxide-test-macros = { path = "crates/oxide-test-macros", version = "0.1.0" }
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
regex = "1"
testcontainers = "0.28"
axum = "0.8"
mongodb = "3.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["timeout", "limit", "cors"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
inventory = "0.3"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
tempfile = "3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"

# Debug artefacts dominate `target/`: a full workspace test build with the
# default settings reached 61 GB, ~42 GB of it debug info in `debug/deps`.
# Dependencies are never stepped through, so they are built without debug info;
# workspace crates keep line tables, which is what backtraces and `cargo test`
# panic locations actually read.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Line tables in release too, so `perf`/`samply` flamegraphs from a load test
# resolve to file and line without changing codegen.
[profile.release]
debug = "line-tables-only"
