[workspace]
resolver = "3"
members = [
    "crates/oxide-core",
    "crates/oxide-macros",
    "crates/oxide-boot",
    "crates/oxide-web",
    "crates/oxide-web-macros",
    "crates/oxide-observability",
    "crates/oxide-kafka",
    "crates/oxide-kafka-macros",
    "crates/oxide-mongo",
    "crates/oxide-mongo-macros",
    "crates/oxide-cache",
    "crates/oxide-cache-macros",
    "crates/oxide-redis",
    "crates/oxide-scheduler",
    "crates/oxide-scheduler-macros",
    "crates/oxide-redis-test",
    "crates/oxide-mongo-test",
    "crates/oxide-kafka-test",
    "crates/oxide-client",
    "crates/oxide-client-macros",
    "crates/oxide-test",
    "crates/oxide-test-macros",
    "examples/hello-world",
    "examples/rest-api",
    "examples/http-client",
    "examples/kafka",
    "examples/showcase",
    "tests/smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
# V1 does not publish to crates.io; every workspace library crate sets
# `publish.workspace = true` to pick this up.
publish = false

[workspace.dependencies]
oxide-core = { path = "crates/oxide-core", version = "0.1.0" }
oxide-macros = { path = "crates/oxide-macros", version = "0.1.0" }
oxide-boot = { path = "crates/oxide-boot", version = "0.1.0" }
oxide-web = { path = "crates/oxide-web", version = "0.1.0" }
oxide-web-macros = { path = "crates/oxide-web-macros", version = "0.1.0" }
oxide-observability = { path = "crates/oxide-observability", version = "0.1.0" }
oxide-kafka = { path = "crates/oxide-kafka", version = "0.1.0" }
oxide-kafka-macros = { path = "crates/oxide-kafka-macros", version = "0.1.0" }
oxide-mongo = { path = "crates/oxide-mongo", version = "0.1.0" }
oxide-mongo-macros = { path = "crates/oxide-mongo-macros", version = "0.1.0" }
oxide-cache = { path = "crates/oxide-cache", version = "0.1.0" }
oxide-cache-macros = { path = "crates/oxide-cache-macros", version = "0.1.0" }
oxide-redis = { path = "crates/oxide-redis", version = "0.1.0" }
oxide-scheduler = { path = "crates/oxide-scheduler", version = "0.1.0" }
oxide-scheduler-macros = { path = "crates/oxide-scheduler-macros", version = "0.1.0" }
oxide-redis-test = { path = "crates/oxide-redis-test", version = "0.1.0" }
oxide-mongo-test = { path = "crates/oxide-mongo-test", version = "0.1.0" }
oxide-kafka-test = { path = "crates/oxide-kafka-test", version = "0.1.0" }
oxide-client = { path = "crates/oxide-client", version = "0.1.0" }
oxide-client-macros = { path = "crates/oxide-client-macros", version = "0.1.0" }
oxide-test = { path = "crates/oxide-test", version = "0.1.0" }
oxide-test-macros = { path = "crates/oxide-test-macros", version = "0.1.0" }
# `ssl` and `sasl` are not optional extras here: without them librdkafka is
# compiled without the code paths for TLS and SASL, and
# `security.protocol=SASL_SSL` fails at *runtime* with "built without SASL
# support" -- on the first connection to a secured cluster, in production.
# The passthrough in `oxide.kafka.properties` is useless without them.
#
# System OpenSSL/cyrus-sasl rather than `ssl-vendored`: the runtime image
# already ships libssl3 and libsasl2-2, and vendoring would compile OpenSSL
# on every clean build. `gssapi` (Kerberos) is left off -- it needs libkrb5
# at build and run time, and SCRAM covers what a managed Kafka offers.
# TLS and SASL are added by `oxide-kafka`'s own `security` feature rather
# than here, so a build that does not need them does not compile OpenSSL and
# cyrus-sasl. See that crate's `[features]`.
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
regex = "1"
testcontainers = "0.28"
axum = "0.8"
mongodb = "3.8"
tower = "0.5"
# TLS for the HTTP server. rustls, not OpenSSL: no system dependency, so the
# container image stays slim and the build stays reproducible.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower-http = { version = "0.7", features = ["timeout", "limit", "cors"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
inventory = "0.3"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
tempfile = "3"
# `tls-rustls` (not native-tls): rustls needs no system OpenSSL, which keeps
# the container image slim and the build reproducible. Enables `rediss://`.
redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "script",
    "tls-rustls",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"

# Debug artefacts dominate `target/`: a full workspace test build with the
# default settings reached 61 GB, ~42 GB of it debug info in `debug/deps`.
# Dependencies are never stepped through, so they are built without debug info;
# workspace crates keep line tables, which is what backtraces and `cargo test`
# panic locations actually read.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Line tables in release too, so `perf`/`samply` flamegraphs from a load test
# resolve to file and line without changing codegen.
[profile.release]
debug = "line-tables-only"
