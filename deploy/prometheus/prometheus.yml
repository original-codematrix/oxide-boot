# 10s, not the 2s this started at. A load test's interesting window is short,
# so a fast scrape is tempting -- but the dashboard queries at a 15s minimum
# step, so anything finer is stored and never drawn. At 2s, with the `uri`
# label plus k6's remote write, the TSDB grew past its 2 GB limit and
# Prometheus was OOM-killed mid-run twice, taking the dashboard with it.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: showcase
    metrics_path: /actuator/prometheus
    static_configs:
      # Both are listed on purpose: the service runs on the host by default and
      # inside the network under the `in-network` compose profile. Whichever is
      # not running simply shows as a down target.
      - targets: ["host.docker.internal:8081"]
        labels:
          service: showcase
          placement: host
      - targets: ["showcase:8081"]
        labels:
          service: showcase
          placement: in-network

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
