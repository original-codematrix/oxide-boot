# A load test's interesting window is often under a minute, so the scrape
# interval is short: at the default 15s a 30s run yields two points.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: showcase
    metrics_path: /actuator/prometheus
    static_configs:
      # Both are listed on purpose: the service runs on the host by default and
      # inside the network under the `in-network` compose profile. Whichever is
      # not running simply shows as a down target.
      - targets: ["host.docker.internal:8081"]
        labels:
          service: showcase
          placement: host
      - targets: ["showcase:8081"]
        labels:
          service: showcase
          placement: in-network

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
