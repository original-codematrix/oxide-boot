apiVersion: 1

providers:
  - name: oxide
    orgId: 1
    folder: Oxide Boot
    type: file
    disableDeletion: false
    # The dashboard JSON is mounted read-only, so edits in the UI are for
    # experimenting; commit them back to the file to keep them.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
