apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: oxide-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # The floor for $__rate_interval and for the step Grafana sends. Set to
      # 15s rather than the 2s scrape interval: at 2s a 15-minute window
      # returns hundreds of points per series and the dashboard becomes
      # sluggish, without showing anything the coarser resolution misses.
      # Individual panels can still ask for finer via their own min interval.
      timeInterval: 15s
