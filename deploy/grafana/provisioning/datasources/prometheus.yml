apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: oxide-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Matches the scrape interval in prometheus.yml, so Grafana's `$__rate_interval`
      # resolves to something sane on short load-test windows.
      timeInterval: 2s
